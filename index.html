<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F9F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A150B" />
    <meta name="description" content="Sistema de Gestão Integrada da Normatel. Ficha Técnica de Avaliação de Serviços." />
    <!-- iOS ignora o manifest para tela cheia e nome do ícone: precisa destas
         metas próprias. `black-translucent` deixa o conteúdo ir até o topo, o
         que combina com o viewport-fit=cover acima e com as classes .safe-*. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ficha Técnica" />
    <meta name="application-name" content="Ficha Técnica" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Gestão Integrada · Ficha Técnica de Avaliação de Serviços</title>
    <!-- Aplica o tema antes do primeiro paint. Sem isso a tela pisca clara no
         modo escuro (FOUC), que é bem visível num tema escuro. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('normatel-theme')
          if (t !== 'light') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
